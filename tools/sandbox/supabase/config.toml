# Dedicated Supabase CLI project for the shared TAB-HUB hosted sandbox.
# It deliberately has its own migration directory and never replays
# ../../../../supabase/migrations.
project_id = "tap-hub-shared-sandbox"

[api]
schemas = ["public", "graphql_public", "tap_hub_project"]
extra_search_path = ["public", "extensions", "tap_hub_project"]
max_rows = 1000

[db]
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false
